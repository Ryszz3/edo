<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Загрузка Word файла</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            background: #fff;
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 24px;
        }
        .upload-area {
            border: 2px dashed #667eea;
            border-radius: 12px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #f8f9ff;
            margin-bottom: 20px;
        }
        .upload-area:hover {
            border-color: #764ba2;
            background: #f0f2ff;
        }
        .upload-area.dragover {
            border-color: #764ba2;
            background: #e8ebff;
        }
        .upload-icon {
            font-size: 48px;
            margin-bottom: 12px;
        }
        .upload-text {
            color: #666;
            font-size: 15px;
            margin-bottom: 8px;
        }
        .upload-hint {
            color: #999;
            font-size: 13px;
        }
        #file-input {
            display: none;
        }
        #file-name {
            text-align: center;
            color: #333;
            font-size: 14px;
            margin-bottom: 20px;
            padding: 10px;
            background: #f0f2ff;
            border-radius: 8px;
            display: none;
        }
        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: opacity 0.3s ease;
        }
        .btn:hover {
            opacity: 0.9;
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .message {
            text-align: center;
            margin-top: 16px;
            font-size: 14px;
            padding: 10px;
            border-radius: 8px;
        }
        .message.success {
            background: #d4edda;
            color: #155724;
        }
        .message.error {
            background: #f8d7da;
            color: #721c24;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Загрузка Word файла</h1>
        <form method="post" enctype="multipart/form-data" id="upload-form">
            {% csrf_token %}
            <div class="upload-area" id="drop-area">
                <div class="upload-icon">📄</div>
                <div class="upload-text">Перетащите файл сюда или нажмите для выбора</div>
                <div class="upload-hint">Поддерживаются файлы .doc и .docx</div>
            </div>
            <input type="file" id="file-input" name="word_file" accept=".doc,.docx">
            <div id="file-name"></div>
            <button type="submit" class="btn" id="submit-btn" disabled>Отправить</button>
        </form>
        {% if message %}
            <div class="message {% if message_type == 'success' %}success{% else %}error{% endif %}">
                {{ message }}
            </div>
        {% endif %}
    </div>

    <script>
        const dropArea = document.getElementById('drop-area');
        const fileInput = document.getElementById('file-input');
        const fileName = document.getElementById('file-name');
        const submitBtn = document.getElementById('submit-btn');

        dropArea.addEventListener('click', () => fileInput.click());

        dropArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropArea.classList.add('dragover');
        });

        dropArea.addEventListener('dragleave', () => {
            dropArea.classList.remove('dragover');
        });

        dropArea.addEventListener('drop', (e) => {
            e.preventDefault();
            dropArea.classList.remove('dragover');
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                fileInput.files = files;
                updateFileName(files[0]);
            }
        });

        fileInput.addEventListener('change', () => {
            if (fileInput.files.length > 0) {
                updateFileName(fileInput.files[0]);
            }
        });

        function updateFileName(file) {
            const ext = file.name.split('.').pop().toLowerCase();
            if (ext !== 'doc' && ext !== 'docx') {
                fileName.textContent = 'Пожалуйста, выберите файл .doc или .docx';
                fileName.style.display = 'block';
                fileName.style.background = '#f8d7da';
                fileName.style.color = '#721c24';
                submitBtn.disabled = true;
                return;
            }
            fileName.textContent = 'Выбран файл: ' + file.name;
            fileName.style.display = 'block';
            fileName.style.background = '#f0f2ff';
            fileName.style.color = '#333';
            submitBtn.disabled = false;
        }
    </script>
</body>
</html>
